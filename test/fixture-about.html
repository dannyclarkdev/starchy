<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painter Pro — about (second page for multi-page tests)</title>
<style>
  /* Same header as fixture.html, so its "Book now" bug is shared by both pages. Below ~338px the
     header itself overflows; the home page hides that behind its own horizontal scroll. */
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #222; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 16px 24px; background: #1d2a3a; color: #fff; }
  .logo { font-weight: 700; font-size: 20px; white-space: nowrap; }
  nav { display: flex; flex-wrap: wrap; gap: 8px 28px; justify-content: flex-end; }
  nav a { color: #fff; text-decoration: none; white-space: nowrap; display: block; }
  .book { padding: 8px 14px; background: #f59f00; color: #1d2a3a; border-radius: 6px; text-decoration: none; text-align: center; }
  main { padding: 24px; max-width: 640px; }
</style>
</head>
<body>
  <header>
    <div class="logo">Painter Pro</div>
    <nav>
      <a href="#">Interior</a><a href="#">Exterior</a><a href="#">Cabinets</a>
      <a href="#">Commercial</a><a href="#">Gallery</a><a href="#">Free Estimate</a>
    </nav>
    <a class="book" href="#">Book now</a>
  </header>
  <main>
    <h1>About us</h1>
    <p>Family-run painters since 1998.</p>
  </main>
</body>
</html>
